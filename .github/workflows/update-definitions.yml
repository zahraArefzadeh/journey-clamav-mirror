name: Publish ClamAV definitions

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clamav-definition-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mirror-tag: ${{ steps.mirror.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the mirror contract
        run: bash tests/publish-contract.sh
      - name: Install the supported ClamAV clients
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends clamav clamav-freshclam
      - name: Build verified definitions site
        id: mirror
        env:
          PAGES_SITE_DIRECTORY: ${{ runner.temp }}/pages-site
        run: |
          bash scripts/publish-definitions.sh
          tag="$(awk -F '\t' '$1 == "tag" {print $2}' "${PAGES_SITE_DIRECTORY}/current.txt")"
          test -n "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the bounded Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Atomically deploy the verified definitions
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  record:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record only the manifest served after deployment
        env:
          EXPECTED_TAG: ${{ needs.build.outputs.mirror-tag }}
        run: |
          set -euo pipefail
          served_manifest="${RUNNER_TEMP}/current.txt"
          manifest_url="https://zahraarefzadeh.github.io/journey-clamav-mirror/current.txt"
          matched=0
          for _ in $(seq 1 20); do
            curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 --output "$served_manifest" "$manifest_url" || true
            if awk -F '\t' -v expected="$EXPECTED_TAG" \
              '$1 == "tag" && $2 == expected {matched = 1} END {exit matched == 1 ? 0 : 1}' \
              "$served_manifest" 2>/dev/null; then
              matched=1
              break
            fi
            sleep 3
          done
          test "$matched" -eq 1
          test "$(wc -l < "$served_manifest")" -eq 5
          install -m 0644 "$served_manifest" current.txt
          if ! git diff --quiet -- current.txt; then
            git config user.name 'journey-clamav-mirror[bot]'
            git config user.email 'journey-clamav-mirror[bot]@users.noreply.github.com'
            git add -- current.txt
            git commit -m "chore: record deployed ClamAV definitions"
            git push origin HEAD:main
          fi
